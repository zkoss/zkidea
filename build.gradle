plugins {
    id 'org.jetbrains.intellij' version '1.17.2'
    id 'java'
}

group 'org.zkoss.zkidea'
version '1.0.0'

repositories {
    mavenCentral()
    maven { url 'https://www.jetbrains.com/intellij-repository/releases' }

    maven { url "https://cache-redirector.jetbrains.com/intellij-dependencies" }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.13.1'

    testImplementation 'org.zkoss.zk:zkbind:10.0.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.8.2'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.8.2'
    testImplementation 'org.junit.platform:junit-platform-suite:1.8.2'
    testImplementation 'org.junit.vintage:junit-vintage-engine:5.8.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:4.6.1'
    testImplementation 'org.mockito:mockito-inline:4.6.1'
}

intellij {
    version = '2023.3'
    plugins = ['maven', 'com.intellij.java']
}
patchPluginXml {
    sinceBuild = '233.2'
    // No upper bound: compatible with all future IDE builds. Run `./gradlew runPluginVerifier`
    // against new/EAP builds to catch API breakage instead of bumping until-build each release.
    untilBuild = provider { null }
}

java.sourceCompatibility = JavaVersion.VERSION_17
java.targetCompatibility = JavaVersion.VERSION_17

test {
    useJUnitPlatform()
}

publishPlugin {
    token = project.findProperty("intellijPublishToken") ?: ""
}

intellij {
    // Moves the sandbox to a hidden folder to avoid being cleaned
    sandboxDir = "${project.projectDir}/.sandbox"
}

// Bundle the standalone ZUL rendering core (zk-preview-launcher.jar) inside this
// plugin's distribution so ZulPreviewServerService can spawn it as a helper JVM at
// runtime. Landing spot: "<pluginName>/lib/zk-preview-launcher.jar", read back at
// runtime via PluginManagerCore.getPlugin(...).getPluginPath(). buildPlugin packages
// prepareSandbox's own output directory, so wiring it here covers both `runIde`'s
// sandbox and the `buildPlugin` distribution zip.
// (evaluationDependsOn is required so ':zk-preview-launcher's `jar` task already
// exists by the time this project's build.gradle references it by name.)
evaluationDependsOn(':zk-preview-launcher')
tasks.named('prepareSandbox') {
    dependsOn ':zk-preview-launcher:jar'
    from(project(':zk-preview-launcher').tasks.named('jar')) {
        into "${project.name}/lib"
    }
}

// ZulPreviewLauncherSeamTest (E3-G1b) spawns the real packaged launcher jar; needs it
// built first, and needs to know exactly where.
tasks.named('test') {
    dependsOn ':zk-preview-launcher:jar'
    systemProperty 'zkpreview.launcherJar',
            project(':zk-preview-launcher').tasks.named('jar').get().archiveFile.get().asFile.absolutePath
}