name: Release zk-preview-launcher

# Attaches the standalone ZUL render helper consumed by the `zul-writer` agent skill
# (zkoss-demo/agent-skill), which pins an exact version + SHA-256, to the plugin's own
# `v*` Release. Launcher and plugin versions therefore move together: the consumer builds
# the download URL out of the tag name, so zk-preview-launcher/build.gradle's `version`
# has to be the tag. The "Refuse to publish if the tag and build.gradle disagree" step
# below is what enforces that -- it is the guard, not a formality.
#
# The tag may already carry a Release (the plugin's own), so the publish step is
# create-or-upload. `--clobber` there REPLACES the asset bytes at a URL a consumer may
# already have pinned, so re-running this job for a tag that was released once is a
# deliberate pin-breaker: bump the version instead of re-cutting the same tag.
#
# Publishing from Actions (github.token) rather than a maintainer's local `gh` is not
# incidental: the local `gh` account historically lacked push on this repo, which is what
# stalled earlier releases. See zk-preview-launcher/README.md for the manual fallback.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to build and release'
        required: true

permissions:
  contents: write   # create a release; the org default may be read-only

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'          # matches the launcher's source/targetCompatibility

      - uses: gradle/actions/setup-gradle@v4

      - name: Derive the version from the tag
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG"                  >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"          >> "$GITHUB_OUTPUT"

      # -x test on purpose: the launcher's own tests spawn mvn subprocesses and Playwright
      # browsers. They are a pre-tag local gate, not a release-path gate.
      - name: Build the versioned jar + checksum
        run: ./gradlew --no-daemon :zk-preview-launcher:releaseLauncher -x test

      - name: Refuse to publish if the tag and build.gradle disagree
        run: |
          f="zk-preview-launcher/build/release/zk-preview-launcher-${{ steps.v.outputs.version }}.jar"
          if [ ! -f "$f" ]; then
            echo "::error::${{ steps.v.outputs.tag }} does not match the version in zk-preview-launcher/build.gradle"
            ls -l zk-preview-launcher/build/release/ || true
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd zk-preview-launcher/build/release
          V='${{ steps.v.outputs.version }}'
          SHA=$(cut -d' ' -f1 "zk-preview-launcher-$V.jar.sha256")
          cat > notes.md <<EOF
          Standalone ZUL rendering core. The same artifact the ZK IntelliJ plugin bundles at
          \`<plugin>/lib/zk-preview-launcher.jar\`, published here so external consumers
          (e.g. the \`zul-writer\` agent skill) can pin an exact version.

          **Requires Java 17+.** ZK jars are never bundled -- supply your own via \`--classpath\`.

          \`\`\`
          java -jar zk-preview-launcher-$V.jar \\
               --classpath <os-separated ZK jars> \\
               --webapp <docroot dir> \\
               --port 0
          \`\`\`

          Prints \`PREVIEW_PORT=<n>\` on stdout once bound, then blocks until killed.

          **SHA-256** \`$SHA\`

          Verify with \`shasum -a 256 -c zk-preview-launcher-$V.jar.sha256\`.
          EOF
          # The tag is the plugin's own, so a Release for it may already exist (cut by a
          # maintainer, or by an earlier run of this job). Upload into it rather than
          # failing; only create when there is nothing there yet.
          TAG='${{ steps.v.outputs.tag }}'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "zk-preview-launcher-$V.jar" \
              "zk-preview-launcher-$V.jar.sha256"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "zk-preview-launcher $V" \
              --notes-file notes.md \
              "zk-preview-launcher-$V.jar" \
              "zk-preview-launcher-$V.jar.sha256"
          fi
