plugins {
    id 'java'
}

group 'org.zkoss.zkpreview'
// Tracks the IntelliJ plugin's own version (root build.gradle), because the release asset
// built from this module is attached to the plugin's `v<this value>` GitHub Release rather
// than to a launcher-specific tag. External consumers -- currently the `zul-writer` agent
// skill (zkoss-demo/agent-skill) -- pin an exact version + SHA-256 and derive the download
// URL from the tag name, so this number MUST equal the tag the asset is published under;
// `.github/workflows/release-launcher.yml` refuses to publish when the two disagree.
// See README.md.
version '1.0.3'

java.sourceCompatibility = JavaVersion.VERSION_17
java.targetCompatibility = JavaVersion.VERSION_17

repositories {
    mavenCentral()
    // Only used to resolve the fixed, old ZK version the isolation-hook classes are
    // compiled against (see the `hooks` sourceSet below). Never used for the main
    // launcher, which has zero ZK compile dependencies (AC-2).
    maven { url 'https://mavensync.zkoss.org/maven2' }
}

// The isolation hook classes (PreviewUiFactory/PreviewComposer) subclass ZK classes,
// so they must be compiled against a ZK jar. They are compiled in a separate sourceSet
// so the main launcher sourceSet keeps zero ZK compile dependencies. Compiled against
// the oldest ZK version this launcher supports (ZK CE 9.6.0.2, javax) to maximise
// binary compatibility with newer ZK releases (risk R3) -- the two overridden methods
// (SimpleUiFactory#newComposer, GenericComposer's no-arg ctor) are stable ZK-core API
// present unchanged from 9.6.0.2 through 10.1.0-jakarta (verified via javap on both).
sourceSets {
    hooks {
        java {
            srcDirs = ['src/hooks/java']
        }
    }
}

dependencies {
    // Mock servlet classes implement both servlet APIs; the same package tree
    // (different Java packages: jakarta.servlet.* vs javax.servlet.*) never collides,
    // so both variants live in one sourceSet without needing separate Gradle variants.
    implementation 'jakarta.servlet:jakarta.servlet-api:5.0.0'
    implementation 'javax.servlet:javax.servlet-api:4.0.1'

    // Auto-generated by the `hooks` sourceSet declaration above.
    hooksCompileOnly 'org.zkoss.zk:zk:9.6.0.2'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'

    // Optional browser-equivalence check (E1-G2). If unavailable/unable to install
    // browsers in this environment, tests degrade to the documented HTTP fallback.
    testImplementation 'com.microsoft.playwright:playwright:1.44.0'
}

test {
    useJUnitPlatform()
    // Integration-style tests spawn mvn subprocesses / start real HTTP servers;
    // give them room on slower CI machines.
    systemProperty 'zkpreview.repoRoot', rootProject.projectDir.absolutePath
    systemProperty 'zkpreview.moduleDir', projectDir.absolutePath
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

compileHooksJava {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Packages the isolation-hook classes into their own tiny jar, embedded as a main-jar
// resource. At render time this jar is extracted and added as a URL on the scoped ZK
// classloader (never on the launcher's own classloader) so the hook classes resolve
// their ZK superclasses/interfaces through the SAME classloader as the target ZK
// version supplied via --classpath (see IsolatedRuntime).
task hooksJar(type: Jar) {
    archiveFileName = 'zkpreview-hooks.jar'
    destinationDirectory = layout.buildDirectory.dir('hooksJar')
    from sourceSets.hooks.output
}

sourceSets.main.resources.srcDir(layout.buildDirectory.dir('hooksJarResource'))

task copyHooksJarIntoResources(type: Copy) {
    dependsOn hooksJar
    from hooksJar.archiveFile
    into layout.buildDirectory.dir('hooksJarResource')
}

processResources.dependsOn(copyHooksJarIntoResources)

// The released jar is published under a SHA-256 pin, so rebuilding the same tag must
// reproduce the same bytes; without these, entry timestamps and filesystem iteration
// order alone change the digest. Applied to every Jar task, not just `jar`: hooksJar is
// embedded as a main-jar resource, so its non-determinism would leak into `jar` too.
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Runnable jar: bundles the (small, non-conflicting) servlet-api classes so
// `java -jar zk-preview-launcher.jar` works standalone; ZK jars are supplied
// separately at runtime via --classpath (never bundled -- AC-2).
jar {
    archiveFileName = 'zk-preview-launcher.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'org.zkoss.zkpreview.Main'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

test.dependsOn(jar)

// ---- Standalone distribution (GitHub Releases) ------------------------------------
// The IntelliJ plugin keeps consuming build/libs/zk-preview-launcher.jar under that
// exact name (ZulPreviewServerService.LAUNCHER_JAR_NAME, the root project's
// prepareSandbox wiring, IsolationChildProcessTest), so `jar` is deliberately NOT
// renamed. Release assets are versioned *copies* under build/release/, giving external
// consumers a stable, immutable URL per release to pin against.
def releaseAssetName = "zk-preview-launcher-${version}.jar"
def releaseOutputDir = layout.buildDirectory.dir('release')

tasks.register('releaseJar', Copy) {
    group = 'distribution'
    description = 'Versioned copy of the launcher jar, for a GitHub Release.'
    from tasks.named('jar')
    into releaseOutputDir
    rename { releaseAssetName }
}

tasks.register('releaseChecksum') {
    group = 'distribution'
    description = 'SHA-256 sidecar for the versioned launcher jar.'
    dependsOn 'releaseJar'
    def asset = releaseOutputDir.map { it.file(releaseAssetName) }
    def sidecar = releaseOutputDir.map { it.file(releaseAssetName + '.sha256') }
    inputs.file(asset)
    outputs.file(sidecar)
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        asset.get().asFile.eachByte(64 * 1024) { buf, n -> digest.update(buf, 0, n) }
        def hex = digest.digest().encodeHex().toString()
        // Two spaces between digest and filename: `shasum -a 256 -c` / `sha256sum -c` format.
        sidecar.get().asFile.text = "${hex}  ${releaseAssetName}\n"
        logger.lifecycle("SHA-256 ${hex}  ${releaseAssetName}")
    }
}

tasks.register('releaseLauncher') {
    group = 'distribution'
    description = "Builds build/release/${releaseAssetName} and its .sha256 sidecar."
    dependsOn 'releaseChecksum'
}
